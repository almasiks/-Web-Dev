<div class="container">
  <button [routerLink]="['/albums', albumId]">← Back to Album</button>

  <h2>Album #{{albumId}} Photos</h2>

  <div class="photos-grid">
    <div *ngFor="let photo of photos" class="photo-card">
      
       <img [src]="'https://picsum.photos/150?random=' + photo.id" [alt]="photo.title">
      
      <div class="photo-info">
        <p>{{photo.title}}</p>
        <a [href]="photo.url" target="_blank">View Full Image</a>
      </div>
      
    </div>
  </div>
</div>
