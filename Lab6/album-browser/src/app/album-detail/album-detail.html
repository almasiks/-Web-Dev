<div *ngIf="loading">Loading details...</div>

<div *ngIf="album && !loading">
  <h1>Album Details</h1>
  <h2>{{ album.title }}</h2>
  <p><strong>User ID:</strong> {{ album.userId }}</p>
  <p><strong>Album ID:</strong> {{ album.id }}</p>

  <label>
    <strong>Edit Title:</strong>
    <input [(ngModel)]="album.title" type="text" style="width: 300px;">
  </label>
  <br><br>
  
  <button (click)="saveTitle()">Save</button>
  
  <button [routerLink]="['/album', album.id, 'photos']">View Photos</button>
  
  <button [routerLink]="['/albums']">Back to Albums</button>
</div>
