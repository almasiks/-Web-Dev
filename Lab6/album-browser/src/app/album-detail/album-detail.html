<div *ngIf="album" class="detail-card">
  <button (click)="goBack()" class="back-btn">← Back to List</button>
  
  <div class="info-header">
    <h2>Edit Album #{{album.id}}</h2>
    <p>User ID: {{album.userId}}</p>
  </div>

  <div class="edit-section">
    <label for="title">Album Title:</label>
    <input id="title" [(ngModel)]="album.title" type="text">
    <div class="actions">
      <button (click)="save()" class="save-btn">Save Changes</button>
      <button [routerLink]="['/albums', album.id, 'photos']" class="photos-btn">View Photos</button>
    </div>
  </div>
</div>
